<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Query Engine{% endblock %}</title>
  <script src="https://unpkg.com/htmx.org@2.0.3"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
  <script>mermaid.initialize({ startOnLoad: false, theme: "dark" });</script>
  <style>
    :root { --bg:#0d1117; --panel:#161b22; --border:#30363d; --fg:#e6edf3; --muted:#8b949e; --accent:#58a6ff; --good:#3fb950; --bad:#f85149; }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace; }
    a { color:var(--accent); text-decoration:none; }
    header { padding:14px 24px; border-bottom:1px solid var(--border); display:flex; gap:18px; align-items:center; }
    header h1 { font-size:16px; margin:0; }
    main { max-width:1100px; margin:0 auto; padding:24px; }
    .panel { background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:18px; margin-bottom:18px; }
    h2 { font-size:14px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:0 0 12px; }
    table { width:100%; border-collapse:collapse; font-size:13px; }
    th,td { text-align:left; padding:6px 10px; border-bottom:1px solid var(--border); }
    th { color:var(--muted); font-weight:600; }
    textarea { width:100%; min-height:120px; background:#0d1117; color:var(--fg); border:1px solid var(--border); border-radius:6px; padding:10px; font:13px ui-monospace,monospace; }
    select,button { background:#21262d; color:var(--fg); border:1px solid var(--border); border-radius:6px; padding:8px 14px; font:13px ui-monospace,monospace; cursor:pointer; }
    button.primary { background:var(--accent); color:#0d1117; border-color:var(--accent); font-weight:700; }
    .metrics { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; }
    .metric { background:#0d1117; border:1px solid var(--border); border-radius:6px; padding:12px; }
    .metric .v { font-size:20px; font-weight:700; }
    .metric .k { color:var(--muted); font-size:11px; text-transform:uppercase; }
    .pill { padding:2px 8px; border-radius:999px; font-size:11px; font-weight:700; }
    .pill.success{background:rgba(63,185,80,.15);color:var(--good);}
    .pill.error{background:rgba(248,81,73,.15);color:var(--bad);}
    .pill.running,.pill.pending{background:rgba(88,166,255,.15);color:var(--accent);}
    pre { background:#0d1117; border:1px solid var(--border); border-radius:6px; padding:12px; overflow:auto; }
    .muted { color:var(--muted); }
    .bar { height:8px; background:#0d1117; border-radius:4px; overflow:hidden; border:1px solid var(--border); }
    .bar > span { display:block; height:100%; background:var(--good); }
  </style>
</head>
<body>
  <header>
    <h1>⚡ Query Engine <span class="muted">over object storage</span></h1>
    <a href="{% url 'dashboard' %}">Dashboard</a>
    <a href="/admin/">Admin</a>
    <a href="/api/catalog/datasets/">API</a>
  </header>
  <main>
    {% if messages %}{% for m in messages %}<div class="panel" style="border-color:var(--bad)">{{ m }}</div>{% endfor %}{% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
